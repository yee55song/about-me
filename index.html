<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>✨자기소개✨</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; line-height: 1.6; color: #444; max-width: 650px; margin: 0 auto; padding: 40px 20px; background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%); min-height: 100vh; }
        .card { background: rgba(255, 255, 255, 0.9); padding: 50px; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 3px solid #fff; }
        h1 { color: #d35400; margin-top: 0; text-align: center; font-size: 2.5em; }
        h2 { color: #e67e22; margin-top: 40px; display: flex; align-items: center; border-bottom: 2px solid #f39c12; padding-bottom: 10px; }
        ul { list-style: none; padding: 0; }
        li { margin-bottom: 15px; padding: 10px; background: #fffaf0; border-radius: 12px; border-left: 5px solid #f39c12; }
        .quote-box { background: #fff5e6; padding: 25px; border-radius: 20px; margin-top: 40px; text-align: center; font-style: italic; color: #d35400; border: 2px solid #f39c12; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.8em; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h1>송예은</h1>
        
        <h2>장래희망 🚀</h2>
        <p>반도체 공정 엔지니어</p>

        <h2>취미 🎨</h2>
        <ul>
            <li>🍰 홈 베이킹</li>
            <li>⛰️ 등산</li>
            <li>📺 아이돌 자체 콘텐츠 시청</li>
        </ul>

        <h2>삶의 목표 ✨</h2>
        <ul>
            <li>✅ 이론을 넘어 실질적인 기술 가치 창출하기</li>
            <li>✅ 데이터 기반의 객관적 문제 해결 능력 기르기</li>
            <li>✅ 투자와 기술력을 겸비해 불로소득 루트로 부자 되기</li>
        </ul>

        <h2>좋아하는 명언 ✍️</h2>
        <div class="quote-box">
            "지식은 정체되지만, 상상력은 세상을 순환시킨다."
        </div>
    </div>
</body>
</html>
