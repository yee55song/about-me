<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>송예은님의 소개 페이지</title>
    <style>
        body { text-align: center; padding: 50px; font-family: '맑은 고딕', sans-serif; background-color: #fcfcfc; }
        h1 { color: #2c3e50; margin-bottom: 20px; font-size: 1.8rem; line-height: 1.5; }
        .box { background-color: #f1f8ff; padding: 30px; border-radius: 15px; display: inline-block; border: 1px solid #d6e4ff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        p { color: #34495e; font-size: 1.1rem; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="box">
        <h1>안녕하세요!<br>부산대학교 재료공학부에 재학 중인 송예은입니다. 😽</h1>
        <hr style="border: 0; height: 1px; background: #d6e4ff; margin: 20px 0;">
        <p>이번 활동을 통해 뜻깊은 경험과 역량을 쌓고자 합니다!</p>
        <p>앞으로 잘 부탁드립니다! 🚀</p>
    </div>
</body>
</html>
